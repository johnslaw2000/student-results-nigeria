services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: studentresults
      POSTGRES_USER: studentuser
      POSTGRES_PASSWORD: studentpass
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    environment:
      DB_NAME: studentresults
      DB_USER: studentuser
      DB_PASS: studentpass
      DB_HOST: db
    ports:
      - "8080:5000"
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    ports:
      - "8081:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - web

volumes:
  postgres_data:

