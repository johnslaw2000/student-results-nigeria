# Secrets live in .env (not committed). Copy .env.example to .env and fill it in.
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in .env}
      POSTGRES_USER: ${DB_USER:?Set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASS:?Set DB_PASS in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    environment:
      DB_NAME: ${DB_NAME:?Set DB_NAME in .env}
      DB_USER: ${DB_USER:?Set DB_USER in .env}
      DB_PASS: ${DB_PASS:?Set DB_PASS in .env}
      DB_HOST: db
    ports:
      - "8080:5000"
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    ports:
      - "8081:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - web

volumes:
  postgres_data:
