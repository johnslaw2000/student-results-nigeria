name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check app imports cleanly
        run: |
          export DB_NAME=fake
          export DB_USER=fake
          export DB_PASS=fake
          export DB_HOST=localhost
          python -c "import app; print('Student Results app loaded successfully!')"

